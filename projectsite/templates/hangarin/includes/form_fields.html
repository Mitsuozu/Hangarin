{# Renders every field of `form` as a Bootstrap column. #}
{% for field in form %}
<div class="{% if field.name == 'title' or field.name == 'description' or field.name == 'content' or field.name == 'name' or field.name == 'username' or field.name == 'password' or field.name == 'task' %}col-12{% else %}col-md-6{% endif %}">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
{% endfor %}
