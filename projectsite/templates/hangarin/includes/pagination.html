{% if is_paginated %}
<nav class="pager" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a class="btn btn-ghost btn-sm" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
  {% else %}
    <span class="btn btn-ghost btn-sm disabled" aria-disabled="true">Previous</span>
  {% endif %}
  <span class="pager-info">Page {{ page_obj.number }} of {{ paginator.num_pages }} · {{ paginator.count }} result{{ paginator.count|pluralize }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-ghost btn-sm" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
  {% else %}
    <span class="btn btn-ghost btn-sm disabled" aria-disabled="true">Next</span>
  {% endif %}
</nav>
{% endif %}
